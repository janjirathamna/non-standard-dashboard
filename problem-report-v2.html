<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Non-Standard Problem Report</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#eef2f6;--panel:#fff;--panel2:#f1f5f9;--line:#d7dee7;--text:#16212c;--muted:#5d6e80;--accent:#0f766e;--accent-ink:#fff;--shade:rgba(15,23,42,.55)}
  [data-theme=dark]{--bg:#0d1218;--panel:#151c24;--panel2:#1c2630;--line:#27323d;--text:#e5ecf3;--muted:#8a99a8;--accent:#2dd4bf;--accent-ink:#04201c;--shade:rgba(0,0,0,.65)}
  body{font-family:'IBM Plex Sans','Noto Sans SC',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:13px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px}
  .btn{display:inline-flex;align-items:center;gap:4px;font-size:12px;line-height:1;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel2);color:var(--text);white-space:nowrap;cursor:pointer}
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
  .tab{font-size:12px;padding:6px 14px;border-radius:6px;color:var(--muted);border:1px solid transparent;cursor:pointer}
  .tab.on{background:var(--panel2);color:var(--text);border-color:var(--line);font-weight:600}
  select,input[type=date]{font-size:12px;padding:5px 7px;border:1px solid var(--line);border-radius:6px;background:var(--panel2);color:var(--text);min-width:0}
  .btn:focus-visible,select:focus-visible,input:focus-visible,.tab:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .lbl{font-size:11px;color:var(--muted)}
  table{border-collapse:collapse;width:100%}
  th{font-weight:600;text-align:left;background:var(--panel2);color:var(--muted);position:sticky;top:0;z-index:1;font-size:12px}
  td,th{padding:7px 12px;border-bottom:1px solid var(--line)}
  tr.grp td{border-top:2px solid var(--muted)}
  td.gname{font-weight:600;background:var(--panel2);vertical-align:top;width:30%}
  td.cnt{text-align:right;font-weight:700;width:90px}
  #overlay{position:fixed;inset:0;background:var(--shade);display:none;z-index:50;padding:12px}
  #overlay.open{display:flex;align-items:center;justify-content:center}
  #modal{width:100%;max-width:1700px;height:94vh;display:flex;flex-direction:column;overflow:hidden}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
</style>
</head>
<body>

<header class="sticky top-0 z-30" style="background:var(--panel);border-bottom:1px solid var(--line)">
  <div class="max-w-[1700px] mx-auto px-3 py-2 flex flex-wrap items-center justify-between gap-2">
    <div class="min-w-0">
      <h1 class="font-bold text-base" id="title"></h1>
      <div class="lbl" id="updated"></div>
    </div>
    <div class="flex flex-wrap items-center gap-1.5">
      <a class="btn primary" id="addData" target="_blank" rel="noopener"
         href="https://docs.google.com/spreadsheets/d/1WzJHUFbjMDLKLfQ_uhiPR2o03y_cvBrWBEGtgKe2cTM/edit?gid=1012980436#gid=1012980436"></a>
      <button class="btn" id="bLang"></button>
      <button class="btn" id="bTheme" title="Theme">◐</button>
    </div>
  </div>
  <div class="max-w-[1700px] mx-auto px-3 pb-2 flex flex-wrap items-center gap-1.5">
    <nav class="flex gap-1 mr-auto">
      <button class="tab on" data-view="machine" id="tabMachine"></button>
      <button class="tab" data-view="model" id="tabModel"></button>
    </nav>
    <input type="date" id="fStart" aria-label="Start"><span class="lbl">–</span>
    <input type="date" id="fEnd" aria-label="End">
    <button class="btn" id="bReset"></button>
  </div>
</header>

<main class="max-w-[1700px] mx-auto px-3 py-3 space-y-3">
  <div id="cards" class="grid grid-cols-2 md:grid-cols-4 gap-2"></div>
  <div class="lbl" id="sortNote"></div>
  <div id="panels" class="grid grid-cols-1 xl:grid-cols-3 gap-3"></div>
  <div id="status" class="text-center lbl"></div>
</main>

<!-- Detail modal -->
<div id="overlay" role="dialog" aria-modal="true">
  <div id="modal" class="panel">
    <div class="flex flex-wrap items-center gap-2 px-4 py-3" style="border-bottom:1px solid var(--line)">
      <div class="font-bold text-base mr-auto"><span class="dot" id="mDot"></span><span id="mTitle"></span></div>
      <select id="mSel" class="max-w-[360px]" aria-label="Filter"></select>
      <button class="btn primary" id="mPng"></button>
      <button class="btn" id="mClose"></button>
    </div>
    <div class="flex-1 min-h-0 grid grid-cols-1 xl:grid-cols-2 gap-3 p-3 overflow-auto">
      <section class="panel p-3 flex flex-col min-h-[300px] xl:min-h-0">
        <div class="font-semibold mb-1" id="mChartTitle"></div>
        <div class="lbl mb-2" id="mSort"></div>
        <div class="flex-1 min-h-0 overflow-auto"><div id="mChartWrap" class="relative"><canvas id="mChart"></canvas></div></div>
      </section>
      <section class="panel flex flex-col min-h-[300px] xl:min-h-0 overflow-hidden">
        <div class="flex-1 min-h-0 overflow-auto">
          <table id="mTable"><thead><tr><th id="thName"></th><th id="thIssue"></th><th class="text-right" id="thCnt"></th></tr></thead><tbody></tbody></table>
        </div>
      </section>
    </div>
  </div>
</div>

<script>
/* ================== CONFIG ================== */
const GAS_URL = 'https://script.google.com/macros/s/AKfycbxNht563H7COeUnwfF4NUImMsv3bFGoIpiHsE4h1tTrPFemxnskTOBsCw02zQ-ts7G8/exec';                              // paste your Web App URL (…/exec); empty = demo data
const APP_VERSION = 'v2-2026-11-03';
const FACTORIES = ['Ayutthaya', 'Terahop 5000', 'Pinewave'];
const FCOLOR = { 'Ayutthaya': '#14b8a6', 'Terahop 5000': '#3b82f6', 'Pinewave': '#10b981' };
const SORT_ASC = true;                           // true = fewest -> most (as specified). false = most -> fewest
const MODEL_INCLUDES_FUNCTION = false;           // Model tab groups by Brand + Model. true = Function + Brand + Model

/* ================== i18n ================== */
const I18N = {
  en: { title: 'Non-Standard Problem Report', addData: '＋ Add Data', tabMachine: 'Machine-Level View', tabModel: 'Model-Based View',
    reset: 'Reset', total: 'Total', cases: 'cases', details: 'Details', all: 'ALL', machine: 'Machine', model: 'Model',
    issue: 'Issue', times: 'Times', exportPng: 'Export Chart PNG', close: 'Close', empty: 'No records.',
    chartMachine: 'Issues per machine', chartModel: 'Issues per model', issuesOf: 'Issue frequency',
    sortAsc: 'Sorted ascending: fewest → most', sortDesc: 'Sorted descending: most → fewest',
    hint: 'Click a bar or “Details” to drill down.', loading: 'Loading data…', updated: 'Updated',
    demo: 'Demo data shown. Set GAS_URL in this file to load your sheets.', error: 'Could not load data: ' },
  zh: { title: '非标准问题报告', addData: '＋ 添加数据', tabMachine: '单机分析', tabModel: '机型排行',
    reset: '重置', total: '总计', cases: '起', details: '详情', all: '全部', machine: '机器', model: '机型',
    issue: '问题', times: '次数', exportPng: '导出图表 PNG', close: '关闭', empty: '暂无记录。',
    chartMachine: '各机器问题数', chartModel: '各机型问题数', issuesOf: '问题频次',
    sortAsc: '升序排列：由少到多', sortDesc: '降序排列：由多到少',
    hint: '点击柱子或“详情”查看明细。', loading: '数据加载中…', updated: '更新时间',
    demo: '当前为演示数据。请在本文件中设置 GAS_URL 以加载表格数据。', error: '数据加载失败：' }
};
let lang = localStorage.getItem('lang') || 'en';
let theme = localStorage.getItem('theme') || 'light';
const t = k => I18N[lang][k] || k;

/* ================== STATE & HELPERS ================== */
let DATA = [], generatedAt = null, view = 'machine', M = null;   // M = { factory, sel } while the modal is open
let mainCharts = [], modalChart = null;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const cmp = (a, b) => SORT_ASC ? a - b : b - a;
const issueLabel = r => (lang === 'zh' && r.issueCn) ? r.issueCn : (r.issueEn || r.issueRaw || '-');
function wrap(str, n = 40) {
  const out = []; let line = '';
  String(str).split(' ').forEach(w => {
    while (w.length > n) { if (line) { out.push(line); line = ''; } out.push(w.slice(0, n)); w = w.slice(n); }
    if ((line + ' ' + w).trim().length > n && line) { out.push(line); line = w; } else line = (line + ' ' + w).trim();
  });
  if (line) out.push(line);
  return out.length ? out : [''];
}

/* item = one machine (Machine tab) or one Brand+Model group (Model tab) */
function itemOf(r) {
  if (view === 'machine') return { key: r.machineKey, label: (lang === 'zh' && r.machineCn) ? r.machineCn : r.machineEn };
  const fn = MODEL_INCLUDES_FUNCTION;
  const keyParts = [r.brandEn, fn ? r.functionEn : '', r.model].filter(Boolean);
  if (!keyParts.length) { const raw = r.machineRaw || '-'; return { key: r.factory + '|' + raw, label: raw }; }   // no keyword match
  const label = lang === 'zh'
    ? (r.brandCn || r.brandEn || '') + (r.model || '') + (fn ? ' ' + (r.functionCn || r.functionEn || '') : '')
    : [r.brandEn, r.model, fn ? r.functionEn : ''].filter(Boolean).join(' ');
  return { key: r.factory + '|' + keyParts.join(' '), label: label.trim() };
}
function buildGroups(rows) {                         // Map key -> { key, label, n, issues: Map }
  const map = new Map();
  rows.forEach(r => {
    const it = itemOf(r);
    const g = map.get(it.key) || { key: it.key, label: it.label, n: 0, issues: new Map() };
    g.n++;
    const ik = r.issueEn || r.issueRaw || '-';
    const i = g.issues.get(ik) || { label: issueLabel(r), n: 0 };
    i.n++; g.issues.set(ik, i); map.set(it.key, g);
  });
  return map;
}
function filtered() {
  const s = $('fStart').value, e = $('fEnd').value;
  return DATA.filter(r => { const d = (r.timestamp || '').slice(0, 10); return (!s || d >= s) && (!e || d <= e); });
}

/* ================== LOAD ================== */
async function load() {
  $('status').textContent = t('loading');
  try {
    if (!GAS_URL) { DATA = demoData(); generatedAt = new Date().toISOString(); $('status').textContent = t('demo'); }
    else {
      const j = await (await fetch(GAS_URL)).json();
      if (!j.ok) throw new Error(j.error);
      DATA = j.data; generatedAt = j.generatedAt; $('status').textContent = '';
    }
  } catch (e) { DATA = []; $('status').textContent = t('error') + e.message; }
  render();
}

/* ================== CHART FACTORY ================== */
function hbar(canvas, labels, values, color, extra) {
  const txt = css('--text'), grid = css('--line'), maxN = Math.max(0, ...values);
  return new Chart(canvas, {
    type: 'bar',
    data: { labels, datasets: [{ data: values, backgroundColor: color, borderRadius: 4, barThickness: 20 }] },
    options: Object.assign({
      indexAxis: 'y', responsive: true, maintainAspectRatio: false, color: txt, animation: { duration: 250 },
      plugins: { legend: { display: false }, tooltip: { callbacks: { title: c => (extra.full || labels)[c[0].dataIndex] } } },
      scales: { x: { beginAtZero: true, suggestedMax: Math.max(6, maxN + 1), ticks: { precision: 0, color: txt }, grid: { color: grid } },
                y: { ticks: { autoSkip: false, color: txt }, grid: { display: false } } }
    }, extra.options || {}),
    plugins: [{ id: 'val', afterDatasetsDraw(c) { const x = c.ctx; x.save(); x.fillStyle = txt; x.font = '600 12px IBM Plex Sans, sans-serif'; x.textBaseline = 'middle';
        c.getDatasetMeta(0).data.forEach((b, i) => x.fillText(values[i], b.x + 6, b.y)); x.restore(); } },
      { id: 'bg', beforeDraw(c) { const x = c.ctx; x.save(); x.globalCompositeOperation = 'destination-over'; x.fillStyle = css('--panel'); x.fillRect(0, 0, c.width, c.height); x.restore(); } }]
  });
}

/* ================== MAIN RENDER ================== */
function render() {
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
  document.documentElement.dataset.theme = theme;
  document.title = $('title').textContent = t('title');
  $('addData').textContent = t('addData');
  $('bLang').textContent = lang === 'en' ? '🌐 中文' : '🌐 EN';
  $('bReset').textContent = t('reset');
  $('tabMachine').textContent = t('tabMachine'); $('tabModel').textContent = t('tabModel');
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.view === view));
  $('updated').textContent = (generatedAt ? `${t('updated')}: ${new Date(generatedAt).toLocaleString(lang === 'zh' ? 'zh-CN' : 'en-GB')} · ` : '') + APP_VERSION;
  $('sortNote').textContent = `${SORT_ASC ? t('sortAsc') : t('sortDesc')}  ·  ${t('hint')}`;

  const rows = filtered();
  const card = (name, n, color) => `<div class="panel px-3 py-2" style="border-left:4px solid ${color}">
    <div class="lbl">${esc(name)}</div><div class="text-2xl font-bold leading-tight">${n}<span class="lbl ml-1">${t('cases')}</span></div></div>`;
  $('cards').innerHTML = FACTORIES.map(f => card(f, rows.filter(r => r.factory === f).length, FCOLOR[f])).join('') + card(t('total'), rows.length, css('--muted'));

  mainCharts.forEach(c => c.destroy()); mainCharts = [];
  $('panels').innerHTML = FACTORIES.map((f, i) => `
    <section class="panel p-3 flex flex-col">
      <div class="flex items-center justify-between mb-2">
        <div class="font-semibold"><span class="dot" style="background:${FCOLOR[f]}"></span>${esc(f)} <span class="lbl">· ${view === 'machine' ? t('chartMachine') : t('chartModel')}</span></div>
        <button class="btn" data-open="${i}">${t('details')}</button>
      </div>
      <div class="overflow-y-auto max-h-[560px]"><div id="pw${i}" class="relative"><canvas id="pc${i}"></canvas></div></div>
    </section>`).join('');

  FACTORIES.forEach((f, i) => {
    const items = [...buildGroups(rows.filter(r => r.factory === f)).values()].sort((a, b) => cmp(a.n, b.n) || a.label.localeCompare(b.label));
    const wrapEl = $('pw' + i);
    if (!items.length) { wrapEl.outerHTML = `<div class="lbl py-8 text-center">${t('empty')}</div>`; return; }
    wrapEl.style.height = Math.max(150, items.length * 30 + 60) + 'px';
    mainCharts.push(hbar($('pc' + i), items.map(x => x.label), items.map(x => x.n), FCOLOR[f], { options: {
      onHover: (e, els) => { e.native.target.style.cursor = els.length ? 'pointer' : 'default'; },
      onClick: (e, els) => { if (els.length) openModal(f, items[els[0].index].key); } } }));
  });
  renderModal();
}

/* ================== MODAL ================== */
function openModal(factory, sel) { M = { factory, sel: sel || 'ALL' }; $('overlay').classList.add('open'); renderModal(); }
function closeModal() { M = null; $('overlay').classList.remove('open'); if (modalChart) { modalChart.destroy(); modalChart = null; } }

function renderModal() {
  if (!M) return;
  const rows = filtered().filter(r => r.factory === M.factory);
  const groups = buildGroups(rows), list = [...groups.values()];
  if (M.sel !== 'ALL' && !groups.has(M.sel)) M.sel = 'ALL';

  $('mDot').style.background = FCOLOR[M.factory];
  $('mTitle').textContent = `${M.factory} · ${view === 'machine' ? t('tabMachine') : t('tabModel')}`;
  $('mPng').textContent = t('exportPng'); $('mClose').textContent = t('close');
  $('mSel').innerHTML = `<option value="ALL">${t('all')}</option>` +
    [...list].sort((a, b) => a.label.localeCompare(b.label)).map(g => `<option value="${esc(g.key)}">${esc(g.label)}</option>`).join('');
  $('mSel').value = M.sel;
  $('mChartTitle').textContent = t('issuesOf') + (M.sel === 'ALL' ? '' : ' · ' + groups.get(M.sel).label);
  $('mSort').textContent = SORT_ASC ? t('sortAsc') : t('sortDesc');
  $('thName').textContent = view === 'machine' ? t('machine') : t('model');
  $('thIssue').textContent = t('issue'); $('thCnt').textContent = t('times');

  const chosen = M.sel === 'ALL' ? list : [groups.get(M.sel)];

  // chart: issues aggregated over the selected machine/model (or the whole factory)
  const agg = new Map();
  chosen.forEach(g => g.issues.forEach((v, k) => { const a = agg.get(k) || { label: v.label, n: 0 }; a.n += v.n; agg.set(k, a); }));
  const items = [...agg.values()].sort((a, b) => cmp(a.n, b.n) || a.label.localeCompare(b.label));
  if (modalChart) { modalChart.destroy(); modalChart = null; }
  if (items.length) {
    $('mChartWrap').style.height = Math.max(260, items.reduce((s, i) => s + Math.max(32, wrap(i.label).length * 15 + 14), 0) + 70) + 'px';
    modalChart = hbar($('mChart'), items.map(i => wrap(i.label)), items.map(i => i.n), FCOLOR[M.factory], { full: items.map(i => i.label) });
  } else $('mChartWrap').style.height = '40px';

  // table: grouped with rowspan, groups and issues both sorted by count
  const gs = [...chosen].sort((a, b) => cmp(a.n, b.n) || a.label.localeCompare(b.label));
  $('mTable').tBodies[0].innerHTML = gs.map(g => {
    const iss = [...g.issues.values()].sort((a, b) => cmp(a.n, b.n) || a.label.localeCompare(b.label));
    return iss.map((i, idx) => `<tr class="${idx === 0 ? 'grp' : ''}">
      ${idx === 0 ? `<td class="gname" rowspan="${iss.length}">${esc(g.label)}<div class="lbl font-normal">${g.n} ${t('cases')}</div></td>` : ''}
      <td>${esc(i.label)}</td><td class="cnt">${i.n}</td></tr>`).join('');
  }).join('') || `<tr><td colspan="3" class="text-center lbl py-6">${t('empty')}</td></tr>`;
}

/* ================== EVENTS ================== */
document.querySelectorAll('.tab').forEach(b => b.onclick = () => { view = b.dataset.view; if (M) M.sel = 'ALL'; render(); });
$('bLang').onclick = () => { lang = lang === 'en' ? 'zh' : 'en'; localStorage.setItem('lang', lang); render(); };
$('bTheme').onclick = () => { theme = theme === 'dark' ? 'light' : 'dark'; localStorage.setItem('theme', theme); render(); };
['fStart', 'fEnd'].forEach(id => $(id).onchange = render);
$('bReset').onclick = () => { $('fStart').value = ''; $('fEnd').value = ''; render(); };
$('panels').onclick = e => { const b = e.target.closest('[data-open]'); if (b) openModal(FACTORIES[+b.dataset.open], 'ALL'); };
$('mSel').onchange = () => { M.sel = $('mSel').value; renderModal(); };
$('mClose').onclick = closeModal;
$('overlay').onclick = e => { if (e.target === $('overlay')) closeModal(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape' && M) closeModal(); });
$('mPng').onclick = () => {
  if (!modalChart) return;
  const a = document.createElement('a');
  a.href = modalChart.toBase64Image('image/png', 1);
  a.download = ('issues-' + M.factory + '-' + new Date().toISOString().slice(0, 10) + '.png').replace(/\s+/g, '_');
  a.click();
};

/* ================== DEMO DATA (only when GAS_URL is empty) ================== */
function demoData() {
  const mk = (f, d, raw, no, mcn, bEn, bCn, fEn, fCn, model, ie, ic) => ({ factory: f, timestamp: d, machineRaw: raw, machineNo: no + '#',
    machineKey: f + '|' + raw.toLowerCase() + '|' + no, machineEn: raw + ' ' + no + '#', machineCn: mcn,
    brandEn: bEn, brandCn: bCn, functionEn: fEn, functionCn: fCn, model, issueRaw: ie, issueEn: ie, issueCn: ic });
  const V = ['Vision system cannot locate material.', '视觉系统无法定位物料'], S = ['Sensor timeout on station 2.', '工位2传感器超时'], P = ['Air pressure low.', '气压过低'], G = ['Glue amount out of specification.', '胶量超出规格'];
  const L = ['LQ', '猎奇', 'ISO', '隔离器', '1.0'], E = ['ENG', '英格', 'Pad Mounting', '贴片', '2.0'];
  return [
    mk('Ayutthaya', '2026-10-28T09:00:00', 'ISO-LQ-(1.0)', 1, '猎奇1.0 1# 隔离器', ...L, ...V),
    mk('Ayutthaya', '2026-10-28T11:00:00', 'ISO-LQ-(1.0)', 1, '猎奇1.0 1# 隔离器', ...L, ...V),
    mk('Ayutthaya', '2026-10-29T08:00:00', 'ISO-LQ-(1.0)', 2, '猎奇1.0 2# 隔离器', ...L, ...V),
    mk('Ayutthaya', '2026-10-29T10:00:00', 'ISO-LQ-(1.0)', 2, '猎奇1.0 2# 隔离器', ...L, ...P),
    mk('Ayutthaya', '2026-10-30T10:00:00', 'Pad Mounting-ENG-(2.0)', 2, '', ...E, ...S),
    mk('Terahop 5000', '2026-10-27T15:00:00', 'Pad Mounting-ENG-(2.0)', 4, '', ...E, ...G),
    mk('Terahop 5000', '2026-10-29T10:30:00', 'Pad Mounting-ENG-(2.0)', 5, '', ...E, ...G),
    mk('Terahop 5000', '2026-10-30T09:00:00', 'Pad Mounting-ENG-(2.0)', 5, '', ...E, ...P),
    mk('Pinewave', '2026-10-30T07:45:00', 'ISO-LQ-(1.0)', 1, '猎奇1.0 1# 隔离器', ...L, ...P),
    mk('Pinewave', '2026-10-31T09:10:00', 'ISO-LQ-(1.0)', 3, '猎奇1.0 3# 隔离器', ...L, ...V)
  ];
}
load();
</script>
</body>
</html>
