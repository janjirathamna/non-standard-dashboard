<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3-Factory Advanced Issue Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen">

    <!-- Navbar -->
    <header class="bg-slate-900 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-[1600px] mx-auto px-6 py-5 flex flex-wrap justify-between items-center gap-4">
            <h1 class="text-2xl font-bold tracking-wide" id="ui-title">📊 3-Factory Advanced Issue Dashboard / 三厂设备故障分析系统</h1>
            <div class="flex items-center gap-4">
                <a id="btn-add-data" href="https://docs.google.com/spreadsheets/d/1WzJHUFbjMDLKLfQ_uhiPR2o03y_cvBrWBEGtgKe2cTM/edit?gid=1012980436#gid=1012980436" target="_blank" class="bg-emerald-600 hover:bg-emerald-500 text-white px-5 py-2.5 rounded-xl text-base font-medium transition shadow-md flex items-center gap-2">
                    ➕ <span id="btn-add-data-text">Add Data / 添加数据</span>
                </a>
                <button onclick="toggleLang()" class="bg-blue-600 hover:bg-blue-500 px-5 py-2.5 rounded-xl text-base font-medium transition shadow-md">
                    🌐 <span id="lang-btn-text">中文 / EN</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-[1600px] mx-auto px-6 py-8 space-y-8">

        <!-- Global Controls Bar -->
        <div class="bg-white p-6 rounded-2xl shadow-sm flex flex-wrap justify-between items-center gap-6">
            <div class="flex flex-wrap items-center gap-6">
                <div>
                    <label class="text-sm font-semibold text-gray-500 block mb-1.5" id="label-start-date">Start Date / 开始日期:</label>
                    <input type="date" id="startDate" onchange="filterAndRender()" class="border border-gray-300 rounded-xl px-4 py-2 text-base focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="text-sm font-semibold text-gray-500 block mb-1.5" id="label-end-date">End Date / 结束日期:</label>
                    <input type="date" id="endDate" onchange="filterAndRender()" class="border border-gray-300 rounded-xl px-4 py-2 text-base focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div class="flex items-end">
                    <button onclick="resetFilters()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-5 py-2 rounded-xl text-base transition font-medium" id="btn-reset">
                        Reset / 重置
                    </button>
                </div>
            </div>
            <div>
                <button onclick="window.print()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-6 py-2.5 rounded-xl text-base font-medium transition shadow-md flex items-center gap-2" id="btn-export">
                    📥 Print Report / 打印报告
                </button>
            </div>
        </div>

        <!-- 3-Column Overview Layout -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8" id="three-factory-container">
            <!-- Injected dynamically -->
        </div>

    </main>

    <!-- Detail Modal -->
    <div id="detailModal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-6 overflow-y-auto">
        <div class="bg-white w-full max-w-7xl rounded-3xl shadow-2xl overflow-hidden my-auto flex flex-col max-h-[92vh]">
            <div class="bg-slate-900 text-white px-8 py-5 flex justify-between items-center">
                <h3 id="modalTitle" class="text-2xl font-bold">Factory Details</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-white text-3xl font-bold">&times;</button>
            </div>
            <div class="p-8 overflow-y-auto space-y-8 flex-1">
                <!-- Chart Section (คงความสูงเดิมตามที่คุณต้องการ) -->
                <div class="bg-white p-6 rounded-2xl border border-gray-200 shadow-sm">
                    <div class="flex justify-between items-center mb-4">
                        <h4 class="font-bold text-lg text-gray-700" id="modalChartTitle">Machine Issue Frequency Breakdown (Ascending / น้อยไปมาก)</h4>
                        <button onclick="exportChartImage()" class="bg-teal-600 hover:bg-teal-500 text-white px-4 py-2 rounded-xl text-sm font-medium transition shadow-sm flex items-center gap-2">
                            📊 Export Chart PNG
                        </button>
                    </div>
                    <div class="relative w-full" id="modalChartWrapper" style="height: 450px;">
                        <canvas id="modalDetailChart"></canvas>
                    </div>
                </div>

                <!-- Table Section (ปรับให้แสดงผลได้หลายบรรทัด ยาวขึ้น ไม่จำกัดพื้นที่สั้นๆ) -->
                <div class="bg-white rounded-2xl border border-gray-200 shadow-sm overflow-hidden">
                    <div class="px-6 py-4 bg-gray-100 border-b font-bold text-gray-700 text-base" id="modalTableTitle">
                        Full Issue Log & Frequency Breakdown (Grouped by Machine)
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse text-base">
                            <thead>
                                <tr class="bg-gray-200 text-gray-700 border-b text-sm uppercase">
                                    <th class="p-4 border-r border-gray-300 w-1/4" id="th-modal-mach">Machine / 机器</th>
                                    <th class="p-4 border-r border-gray-300 w-1/2" id="th-modal-issue">Issue / 故障现象</th>
                                    <th class="p-4 text-center w-1/4" id="th-modal-count">Repeat Count / 发生次数 (น้อย ➔ มาก)</th>
                                </tr>
                            </thead>
                            <tbody id="modalTableBody" class="divide-y divide-gray-200">
                                <!-- Injected via JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxNht563H7COeUnwfF4NUImMsv3bFGoIpiHsE4h1tTrPFemxnskTOBsCw02zQ-ts7G8/exec";

        let currentLang = 'EN';
        let rawData = [];
        let modalChartInstance = null;
        let activeFactoryModal = null;

        const uiText = {
            EN: {
                title: "📊 3-Factory Advanced Issue Dashboard",
                addDataBtn: "➕ Add Data",
                startDate: "Start Date:",
                endDate: "End Date:",
                reset: "Reset",
                exportBtn: "📥 Print Report",
                top3Title: "Top Issues (Ascending / น้อยไปมาก)",
                detailsBtn: "Details / 详情 ➔",
                totalIssues: "Total Issues",
                modalChartTitle: "Machine Issue Frequency Breakdown (Ascending / น้อยไปมาก)",
                modalTableTitle: "Full Issue Log & Frequency Breakdown (Grouped by Machine)",
            },
            CN: {
                title: "📊 三厂高级设备故障分析系统",
                addDataBtn: "➕ 添加数据",
                startDate: "开始日期:",
                endDate: "结束日期:",
                reset: "重置",
                exportBtn: "📥 打印报告",
                top3Title: "故障汇总 (从小到大)",
                detailsBtn: "详情 ➔",
                totalIssues: "总故障数",
                modalChartTitle: "各机器故障现象及发生频次明细 (从小到大)",
                modalTableTitle: "完整故障记录与发生次数明细 (合并机器)",
            }
        };

        function toggleLang() {
            currentLang = currentLang === 'EN' ? 'CN' : 'EN';
            updateUIStrings();
            renderDashboard(filterCurrentData());
        }

        function updateUIStrings() {
            const t = uiText[currentLang];
            document.getElementById('ui-title').innerText = t.title;
            document.getElementById('btn-add-data-text').innerText = t.addDataBtn;
            document.getElementById('label-start-date').innerText = t.startDate;
            document.getElementById('label-end-date').innerText = t.endDate;
            document.getElementById('btn-reset').innerText = t.reset;
            document.getElementById('btn-export').innerText = t.exportBtn;
        }

        async function fetchData() {
            try {
                let response = await fetch(WEB_APP_URL);
                rawData = await response.json();
                renderDashboard(rawData);
            } catch (error) {
                console.error("Error fetching data:", error);
            }
        }

        function resetFilters() {
            document.getElementById('startDate').value = '';
            document.getElementById('endDate').value = '';
            renderDashboard(rawData);
        }

        function filterCurrentData() {
	        const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;

            return rawData.filter(d => {
                let matchDate = true;
                if (d.Timestamp) {
                    const rowDate = d.Timestamp.split(' ')[0];
                    if (startDate && rowDate < startDate) matchDate = false;
                    if (endDate && rowDate > endDate) matchDate = false;
                } else if (startDate || endDate) {
                    matchDate = false;
                }
                return matchDate;
            });
        }

        function filterAndRender() {
            renderDashboard(filterCurrentData());
        }

        function renderDashboard(data) {
            const factories = ["Terahop 5000", "Pinewave", "Ayutthaya"];
            const container = document.getElementById('three-factory-container');
            container.innerHTML = '';

            factories.forEach(factoryName => {
                const factoryData = data.filter(d => d.Factory === factoryName);
                
                const groupData = {};
                factoryData.forEach(d => {
                    const mach = currentLang === 'EN' ? (d.MappedMachineName_EN || d.RawMachineName) : (d.MappedMachineName_CN || d.RawMachineName);
                    const issue = currentLang === 'EN' ? (d.EnglishIssue || d.RawIssue) : (d.ChineseIssue || d.RawIssue);
                    if (!groupData[mach]) groupData[mach] = {};
                    groupData[mach][issue] = (groupData[mach][issue] || 0) + 1;
                });

                let topRowsHtml = '';

                Object.keys(groupData).forEach(mach => {
                    let sorted = Object.entries(groupData[mach])
                        .map(([issue, count]) => ({ issue, count }))
                        .sort((a,b) => a.count - b.count);

                    sorted.forEach(item => {
                        topRowsHtml += `
                            <tr class="hover:bg-gray-50 text-sm">
                                <td class="p-3 font-semibold text-gray-800">${mach}</td>
                                <td class="p-3 text-red-600 font-medium">${item.issue}</td>
                                <td class="p-3 font-bold text-center text-blue-900">${item.count}</td>
                            </tr>
                        `;
                    });
                });

                container.innerHTML += `
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6 flex flex-col justify-between space-y-6">
                        <div>
                            <div class="flex justify-between items-center border-b pb-3 mb-4">
                                <h3 class="font-bold text-xl text-slate-800">${factoryName}</h3>
                                <span class="text-sm bg-blue-50 text-blue-700 px-3 py-1.5 rounded-full font-bold">${uiText[currentLang].totalIssues}: ${factoryData.length}</span>
                            </div>
                            
                            <div class="relative w-full mb-6" style="height: 360px;">
                                <canvas id="chart-${factoryName.replace(/\s+/g, '')}"></canvas>
                            </div>

                            <div class="bg-gray-50 rounded-xl p-3 border border-gray-100">
                                <h4 class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-3">${uiText[currentLang].top3Title}</h4>
                                <div class="overflow-x-auto max-h-64 overflow-y-auto">
                                    <table class="w-full text-left border-collapse">
                                        <thead>
                                            <tr class="text-gray-500 text-xs uppercase border-b">
                                                <th class="p-2">Machine</th>
                                                <th class="p-2">Issue</th>
                                                <th class="p-2 text-center">Qty (น้อย➔มาก)</th>
                                            </tr>
                                        </thead>
                                        <tbody class="divide-y divide-gray-100">
                                            ${topRowsHtml || `<tr><td colspan="3" class="p-3 text-center text-sm text-gray-400">No data</td></tr>`}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>

                        <div class="flex justify-end pt-3 border-t">
                            <button onclick="openModal('${factoryName}')" class="bg-slate-800 hover:bg-slate-700 text-white px-5 py-2.5 rounded-xl text-sm font-medium transition shadow-sm flex items-center gap-1.5">
                                ${uiText[currentLang].detailsBtn}
                            </button>
                        </div>
                    </div>
                `;

                setTimeout(() => renderMiniChart(factoryName, factoryData), 50);
            });
        }

        function renderMiniChart(factoryName, data) {
            const canvasId = `chart-${factoryName.replace(/\s+/g, '')}`;
            const ctx = document.getElementById(canvasId);
            if (!ctx) return;

            const counts = {};
            data.forEach(d => {
                const mach = currentLang === 'EN' ? (d.MappedMachineName_EN || d.RawMachineName) : (d.MappedMachineName_CN || d.RawMachineName);
                counts[mach] = (counts[mach] || 0) + 1;
            });

            const sortedEntries = Object.entries(counts).sort((a, b) => a[1] - b[1]);
            const labels = sortedEntries.map(e => e[0]);
            const values = sortedEntries.map(e => e[1]);

            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        data: values,
                        backgroundColor: '#3b82f6',
                        borderRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { ticks: { font: { size: 11 } } },
                        y: { beginAtZero: true, ticks: { stepSize: 1, font: { size: 11 } } }
                    }
                }
            });
        }

        function openModal(factoryName) {
            activeFactoryModal = factoryName;
            document.getElementById('detailModal').classList.remove('hidden');
            document.getElementById('modalTitle').innerText = `Factory Detail: ${factoryName}`;
            
            const factoryData = filterCurrentData().filter(d => d.Factory === factoryName);
            renderModalContent(factoryData);
        }

        function closeModal() {
            document.getElementById('detailModal').classList.add('hidden');
        }

        function renderModalContent(data) {
            const ctx = document.getElementById('modalDetailChart').getContext('2d');
            if (modalChartInstance) modalChartInstance.destroy();

            const mapCounts = {};
            data.forEach(d => {
                const mach = currentLang === 'EN' ? (d.MappedMachineName_EN || d.RawMachineName) : (d.MappedMachineName_CN || d.RawMachineName);
                const issue = currentLang === 'EN' ? (d.EnglishIssue || d.RawIssue) : (d.ChineseIssue || d.RawIssue);
                const key = `${mach} | ${issue}`;
                mapCounts[key] = (mapCounts[key] || 0) + 1;
            });

            const sortedChartEntries = Object.entries(mapCounts).sort((a, b) => a[1] - b[1]);
            const labels = sortedChartEntries.map(e => e[0]);
            const values = sortedChartEntries.map(e => e[1]);

            modalChartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Frequency (Times)',
                        data: values,
                        backgroundColor: '#0d9488',
                        borderRadius: 4
                    }]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { beginAtZero: true, ticks: { stepSize: 1 } },
                        y: { ticks: { font: { size: 12 } } }
                    }
                }
            });

            const tbody = document.getElementById('modalTableBody');
            tbody.innerHTML = '';

            const machineGroups = {};
            data.forEach(d => {
                const mach = currentLang === 'EN' ? (d.MappedMachineName_EN || d.RawMachineName) : (d.MappedMachineName_CN || d.RawMachineName);
                const issue = currentLang === 'EN' ? (d.EnglishIssue || d.RawIssue) : (d.ChineseIssue || d.RawIssue);

                if (!machineGroups[mach]) machineGroups[mach] = {};
                machineGroups[mach][issue] = (machineGroups[mach][issue] || 0) + 1;
            });

            Object.keys(machineGroups).forEach(mach => {
                const sortedIssues = Object.entries(machineGroups[mach])
                    .map(([issue, count]) => ({ issue, count }))
                    .sort((a, b) => a.count - b.count);

                const rowspan = sortedIssues.length;

                sortedIssues.forEach((item, index) => {
                    let trHtml = `<tr class="hover:bg-gray-50 transition border-b border-gray-200">`;
                    
                    if (index === 0) {
                        trHtml += `
                            <td rowspan="${rowspan}" class="p-4 font-bold text-blue-950 text-lg align-top bg-blue-50/50 border-r border-gray-300">
                                ${mach}
                            </td>
                        `;
                    }

                    trHtml += `
                        <td class="p-4 text-red-600 font-medium border-r border-gray-200">${item.issue}</td>
                        <td class="p-4 font-bold text-gray-800 text-center text-lg bg-gray-50/30">${item.count}</td>
                    </tr>`;

                    tbody.innerHTML += trHtml;
                });
            });
        }

        function exportChartImage() {
            if (!modalChartInstance) return;
            const link = document.createElement('a');
            link.download = `${activeFactoryModal}-chart-ascending.png`;
            link.href = modalChartInstance.toBase64Image();
            link.click();
        }

        fetchData();
    </script>
</body>
</html>
